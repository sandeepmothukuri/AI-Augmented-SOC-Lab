<!-- 
  Wazuh Manager Configuration Reference for AI-Augmented SOC Lab
  Integrates Shuffle SOAR, Active Response Containment, and Custom Detections.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
  </global>

  <!-- Ruleset Configuration -->
  <ruleset>
    <!-- Default Wazuh rules -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>

    <!-- Custom Lab Rules -->
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- Remote Agent Connection -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Syslog Ingestion (UDP 514) for Network Devices and Simulators -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.0.0.0/8</allowed-ips>
    <allowed-ips>172.16.0.0/12</allowed-ips>
    <allowed-ips>192.168.0.0/16</allowed-ips>
  </remote>

  <!-- SOAR Integration: Forward Level >= 7 alerts to Shuffle Webhook -->
  <integration>
    <name>custom-shuffle</name>
    <hook_url>http://shuffle-backend:5001/api/v1/hooks/webhook_wazuh_alerts</hook_url>
    <level>7</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- Active Response Command Definitions -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active Response Rules: Automatically Drop Attacker IP for Brute Force (Rule 100001) -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100001</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Active Response Rules: Block Web Shell Attacker (Rule 100003) -->
  <active-response>
    <command>firewall-drop</command>
    <location>all</location>
    <rules_id>100003</rules_id>
    <timeout>1800</timeout>
  </active-response>
</ossec_config>

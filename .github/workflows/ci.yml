name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black==24.10.0 isort pytest
          pip install -r ai-engine/requirements.txt

      - name: Check formatting
        run: black --check ai-engine/ tests/

      - name: Check imports
        run: isort --check-only ai-engine/ tests/

      - name: Lint Python
        run: flake8 ai-engine/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: Run deterministic tests
        run: pytest -q tests/

  validate-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Compose files
        run: |
          for f in docker/docker-compose.*.yml; do
            echo "Validating $f..."
            docker compose -f "$f" config -q
          done

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON configs
        run: |
          python3 -m json.tool thehive-config/case-templates.json > /dev/null
          python3 -m json.tool shuffle-workflows/ssh-bruteforce.json > /dev/null
          python3 -m json.tool shuffle-workflows/malware-detection.json > /dev/null
          echo "All JSON configs valid"

      - name: Validate XML rules
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.parse('wazuh-config/custom-rules.xml')
          print('Wazuh rules XML valid')
          "

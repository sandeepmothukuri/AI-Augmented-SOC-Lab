title: Unauthorized Sudoers File Tampering
id: a1b2c3d4-e5f6-4a1b-8c2d-3e4f5a6b7c8d
status: test
description: Detects unauthorized writes, appends, or edits targeting /etc/sudoers or files in /etc/sudoers.d/
references:
  - https://attack.mitre.org/techniques/T1548/003/
author: Sandeep Mothukuri
date: 2026/09/29
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  product: linux
  service: auditd
detection:
  selection:
    name|contains:
      - '/etc/sudoers'
      - '/etc/sudoers.d/'
    comm:
      - 'echo'
      - 'tee'
      - 'sed'
      - 'vi'
      - 'nano'
  condition: selection
falsepositives:
  - Authorized system configuration management (Ansible, Puppet, Chef)
level: high

title: Suspicious PowerShell Download Cradle
id: f3a8d9a2-5e4a-4d2b-9e1f-8e2b7a1c3d4e
status: test
description: Detects suspicious PowerShell commands initiating external HTTP/HTTPS downloads via WebClient or Invoke-WebRequest
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Sandeep Mothukuri
date: 2026/09/29
modified: 2026/09/29
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
      - 'iwr '
      - 'curl '
  condition: selection
falsepositives:
  - Legitimate administrative software deployment scripts
level: high
